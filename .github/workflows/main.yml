name: Compile LaTeX

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: Main.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: research-paper
          path: Main.pdf
